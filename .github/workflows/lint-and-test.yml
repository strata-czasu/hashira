name: Lint and Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.10
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
  DATABASE_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres
  # Dummy variables
  BOT_CLIENT_ID: "000000000000000000"
  BOT_DEVELOPER_GUILD_IDS: "000000000000000000"
  BOT_TOKEN: dummy
  REDIS_URL: redis://localhost:6379

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Run Linting
        run: bunx biome lint .

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Check Formatting
        run: bunx biome format .

  # Type checks run on the top PR; migrations and tests also cover the bottom PR.
  types:
    if: >-
      ${{ github.event_name != 'pull_request' ||
      github.event.pull_request.stack == null ||
      github.event.pull_request.stack.position ==
      github.event.pull_request.stack.size }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - name: Generate Prisma Client
        run: bun prisma-generate
      - name: Check Types
        run: bun typecheck

  migrations:
    if: >-
      ${{ github.event_name != 'pull_request' ||
      github.event.pull_request.stack == null ||
      github.event.pull_request.stack.base.ref ==
      github.event.pull_request.base.ref ||
      github.event.pull_request.stack.position ==
      github.event.pull_request.stack.size }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - name: Generate Prisma Client
        run: bun prisma-generate
      - name: Check migrations
        run: bun prisma-check-migrations

  test:
    if: >-
      ${{ github.event_name != 'pull_request' ||
      github.event.pull_request.stack == null ||
      github.event.pull_request.stack.base.ref ==
      github.event.pull_request.base.ref ||
      github.event.pull_request.stack.position ==
      github.event.pull_request.stack.size }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          POSTGRES_PASSWORD: postgres
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install
      - name: Generate Prisma Client
        run: bun prisma-generate
      - name: Prepare test database
        run: bun prisma-migrate-deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_TEST_URL }}
      - name: Run tests
        run: |
          bun test
